name: Tests

# Every push to android and every PR: the host (JVM) unit tests, and the instrumented suite must
# at least COMPILE (it ran on a device only, and once shipped broken — see release.yml). No native
# build, no submodules: neither task needs them, so this takes minutes, not the release's hour.

on:
  push:
    branches: [android]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      # Same SDK step as release.yml, without the NDK and cmake (no native task runs here).
      - name: Install platform
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0"

      - name: Unit tests + instrumented suite compiles
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-report
          path: app/build/reports/tests/
